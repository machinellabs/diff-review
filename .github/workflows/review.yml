name: Self-review

on:
  pull_request:

jobs:
  diff-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install diff-review
        run: python -m pip install .

      - name: Review this PR with diff-review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "ANTHROPIC_API_KEY secret is not set — skipping self-review." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git diff "origin/${{ github.base_ref }}...HEAD" | diff-review --markdown --output review.md
          cat review.md >> "$GITHUB_STEP_SUMMARY"
